<!DOCTYPE html>
<html>
<head>
    <title>Experiment 6 - Registration</title>
    <style>
        body {
            font-family: Arial;
            background-color: #fff3e0;
            text-align: center;
        }

        .box {
            background: white;
            width: 320px;
            margin: 70px auto;
            padding: 25px;
            border: 2px solid darkorange;
            border-radius: 10px;
        }

        h2 {
            color: #c65d18;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            background: #c65d18;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }

        #msg {
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Online Bookstore</h2>
    <h3>Registration Form</h3>

    <form onsubmit="return validateForm()">
        <input type="text" id="name"
               placeholder="Enter your name" required>

        <input type="password" id="password"
               placeholder="Enter password" required>

        <br><br>
        <button type="submit">Register</button>
    </form>

    <p id="msg"></p>
</div>

<script>
function validateForm() {
    var name = document.getElementById("name").value.trim();
    var password = document.getElementById("password").value;
    var msg = document.getElementById("msg");

    if (!/^[A-Za-z ]+$/.test(name) ||
        name.replace(/ /g, "").length < 6) {
        msg.style.color = "red";
        msg.innerHTML =
            "Name must contain only alphabets and at least 6 letters.";
        return false;
    }

    if (password.length < 6) {
        msg.style.color = "red";
        msg.innerHTML =
            "Password must contain at least 6 characters.";
        return false;
    }

    msg.style.color = "green";
    msg.innerHTML = "Registration successful! Details are valid.";
    return false;
}
</script>

</body>
</html>
