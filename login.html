<!DOCTYPE html>
<html>
<head>
    <title>Login - Online Bookstore</title>
</head>
<body style="margin:20px; font-family:Arial;">
<table width="100%"
       border="1"
       cellspacing="0"
       cellpadding="10">
    <tr style="background-color:#F4B183;">
        <td colspan="2" align="center">
            <b style="font-size:20px; color:#7A3508;">
                LOGIN PAGE
            </b>
        </td>
    </tr>
    <tr>
        <td width="40%" align="right">
            User Name:
        </td>
        <td>
            <input type="text"
                   name="username"
                   size="25">
        </td>
    </tr>
    <tr>
        <td align="right">
            Password:
        </td>
        <td>
            <input type="password"
                   name="password"
                   size="25">
        </td>
    </tr>
    <tr>
        <td colspan="2" align="center">
            <input type="submit"
                   value="Submit"
                   style="padding:8px 20px;
                          color:#7A3508;">
                          &nbsp;&nbsp;
            <input type="reset"
                   value="Reset"
                   style="padding:8px 20px;
                          color:#7A3508;">
        </td>
    </tr>
</table>
</body>
</html>
