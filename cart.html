<!DOCTYPE html>
<html>
<head>
    <title>Shopping Cart</title>
</head>
<body style="margin:20px; font-family:Arial;">
<table width="100%"
       border="1"
       cellspacing="0"
       cellpadding="10">
    <tr style="background-color:#F4B183;">
        <td colspan="5" align="center">
            <b style="font-size:21px; color:#7A3508;">
                SHOPPING CART
            </b>
        </td>
    </tr>
    <tr style="background-color:#FCE4D6;"
        align="center">
        <th>Category</th>
        <th>Book Name</th>
        <th>Price</th>
        <th>Quantity</th>
        <th>Amount</th>
    </tr>
    <tr align="center">
        <td>CSE</td>
        <td>Java Programming</td>
        <td>₹450</td>
        <td>2</td>
        <td>₹900</td>
    </tr>
    <tr align="center">
        <td>ECE</td>
        <td>Digital Electronics</td>
        <td>₹390</td>
        <td>1</td>
        <td>₹390</td>
    </tr>
    <tr align="center">
        <td>EEE</td>
        <td>Basic Electrical Engineering</td>
        <td>₹350</td>
        <td>1</td>
        <td>₹350</td>
    </tr>
    <tr>
        <td colspan="4"
            align="right">
            <b>Total Amount</b>
        </td>
        <td align="center">
            <b>₹1640</b>
        </td>
    </tr>
</table>
</body>
</html>
